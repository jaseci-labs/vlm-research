# Full Fine-tuning Configuration
# Full parameter fine-tuning (no LoRA) - Higher resource requirements

name: full
display_name: "Full Fine-tuning"

# No LoRA - fine-tune all parameters
lora:
  enabled: false

# Training hyperparameters (conservative for full fine-tuning)
training:
  learning_rate: 1e-5 # Lower LR for full fine-tuning
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_ratio: 0.1
  max_steps: 200
  max_seq_length: 2048

  fp16: true
  bf16: false

  optim: "adamw_torch"
  lr_scheduler_type: "cosine"
  weight_decay: 0.01

  eval_strategy: "steps"
  eval_steps: 20
  save_strategy: "steps"
  save_steps: 20
  load_best_model_at_end: true

  logging_steps: 5
  seed: 3407
# Note: Full fine-tuning requires significantly more VRAM
# Recommended: 48GB+ VRAM or gradient checkpointing
