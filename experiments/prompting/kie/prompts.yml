baseline:
  name: "Baseline Prompt"
  text: |
    You are an information extraction model.
    Extract the following fields from the document:
    - date
    - doc_no_receipt_no
    - seller_name
    - seller_address
    - seller_phone
    - seller_gst_id
    - total_tax
    - total_amount

    Answer in JSON:
    {
      "date": "...",
      "doc_no_receipt_no": "...",
      "seller_name": "...",
      "seller_address": "...",
      "seller_phone": "...",
      "seller_gst_id": "...",
      "total_tax": "...",
      "total_amount": "..."
    }

    Document (image input): {image_input}

descriptive_roleplay:
  name: "Descriptive Role-play Prompt"
  text: |
    You are a professional data entry clerk working in the finance department.
    Your task is to carefully read the scanned document and extract only the key business fields.
    Do not summarize or add extra information, just act like you are typing values into a database form.

    Some of the fields are:
    - date
    - doc_no_receipt_no
    - seller_name
    - seller_address
    - seller_phone
    - seller_gst_id
    - total_tax
    - total_amount

    Provide your answer in valid JSON format:
    {
      "date": "...",
      "doc_no_receipt_no": "...",
      "seller_name": "...",
      "seller_address": "...",
      "seller_phone": "...",
      "seller_gst_id": "...",
      "total_tax": "...",
      "total_amount": "..."
    }

    Document (image input): {image_input}

